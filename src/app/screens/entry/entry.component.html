<div class="entry">
  <h1 class="entry__headline">{{ copy.headline }}</h1>

  <p class="entry__copy">{{ copy.subheadline }}</p>

  <p class="entry__body" *ngFor="let paragraph of copy.body">{{ paragraph }}</p>

  <p class="entry__meta">
    {{ copy.timeEstimate }}<br />
    {{ copy.requirements }}
  </p>

  <div class="entry__receive">
    <p class="entry__receive-label">What you will receive:</p>
    <ul class="entry__receive-list">
      <li *ngFor="let item of copy.deliverables">{{ item }}</li>
    </ul>
  </div>

  <button type="button" class="entry__cta" (click)="onBegin()">
    {{ copy.cta.primary }}
  </button>
</div>
