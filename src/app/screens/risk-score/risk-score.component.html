<div class="risk-score">
  <h1 class="risk-score__headline">
    Your current role carries
    <span class="risk-score__percentage" [ngClass]="scoreColorClass">{{ score }}%</span>
    AI exposure.
  </h1>

  <p class="risk-score__copy">
    This percentage represents the share of your weekly responsibilities that overlap with tasks AI
    systems can perform now or are likely to perform competently within the next 2–5 years.
  </p>

  <p class="risk-score__disclaimer">
    This is a task exposure score — not a prediction of job loss.
  </p>

  <button type="button" class="risk-score__cta" (click)="onContinue()">See breakdown</button>
</div>
