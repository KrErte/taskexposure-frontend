<div class="assessment-justification">
  <h1 class="assessment-justification__headline">Here's what we found.</h1>

  <section class="assessment-justification__section">
    <h2 class="assessment-justification__section-title">What AI already does well</h2>
    <ul class="assessment-justification__list">
      <li *ngFor="let capability of aiCapabilities">{{ capability }}</li>
    </ul>
  </section>

  <section class="assessment-justification__section">
    <h2 class="assessment-justification__section-title">What AI struggles with</h2>
    <ul class="assessment-justification__list">
      <li *ngFor="let limitation of aiLimitations">{{ limitation }}</li>
    </ul>
  </section>

  <section class="assessment-justification__section">
    <h2 class="assessment-justification__section-title">Signal strength</h2>
    <p class="assessment-justification__signal">
      Signal strength: <strong>{{ signalStrength }}</strong>
    </p>
    <p class="assessment-justification__signal-explanation">
      Based on the specificity and completeness of your input.
    </p>
  </section>

  <button type="button" class="assessment-justification__cta" (click)="onContinue()">
    See your score
  </button>
</div>
