<div class="input-method">
  <h1 class="input-method__headline">How should we analyze your work?</h1>

  <div class="input-method__options">
    <div class="input-method__option input-method__option--disabled">
      <h2 class="input-method__option-title">Upload CV</h2>
      <p class="input-method__option-desc">Faster, requires cleanup — not implemented in v1</p>
    </div>

    <div class="input-method__option input-method__option--active" (click)="onSelectManual()">
      <h2 class="input-method__option-title">Describe manually</h2>
      <p class="input-method__option-desc">More accurate. Takes longer.</p>
    </div>
  </div>
</div>
