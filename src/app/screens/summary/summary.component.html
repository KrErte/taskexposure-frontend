<div class="summary">
  <header class="summary__header">
    <h1 class="summary__headline">{{ copy.headline }}</h1>
    <p class="summary__subheadline">{{ copy.subheadline }}</p>
  </header>

  <!-- KPI Grid -->
  <section class="summary__kpis">
    <app-kpi-grid [items]="kpiItems" [columns]="3"></app-kpi-grid>
  </section>

  <!-- Task Breakdown -->
  <div class="summary__breakdown">
    <div class="summary__column" *ngIf="highExposureTasks.length > 0">
      <div class="glass-card glass-card--rose summary__card">
        <h2 class="summary__section-title">{{ copy.sections.highExposure }}</h2>
        <ul class="summary__list">
          <li *ngFor="let task of highExposureTasks">
            <span class="status-badge status-badge--error">High</span>
            {{ task.description }}
          </li>
        </ul>
      </div>
    </div>

    <div class="summary__column" *ngIf="lowExposureTasks.length > 0">
      <div class="glass-card glass-card--emerald summary__card">
        <h2 class="summary__section-title">{{ copy.sections.lowExposure }}</h2>
        <ul class="summary__list">
          <li *ngFor="let task of lowExposureTasks">
            <span class="status-badge status-badge--success">Low</span>
            {{ task.description }}
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Priority Action -->
  <div class="summary__priority" *ngIf="topAction">
    <div class="glass-card glass-card--accent summary__card">
      <h2 class="summary__section-title">{{ copy.sections.topAction }}</h2>
      <p class="summary__action-title">{{ topAction.title }}</p>
      <p class="summary__action-desc">{{ topAction.description }}</p>
    </div>
  </div>

  <p class="summary__next-steps">{{ copy.nextSteps }}</p>

  <div class="summary__options">
    <button type="button" class="summary__download" (click)="downloadReport()">
      {{ copy.cta.primary }}
    </button>
  </div>
</div>
