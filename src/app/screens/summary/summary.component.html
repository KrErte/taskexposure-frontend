<div class="summary">
  <h1 class="summary__headline">Your assessment is complete.</h1>

  <div class="summary__section">
    <h2 class="summary__section-title">Risk score</h2>
    <p class="summary__score" [ngClass]="scoreColorClass">{{ riskScore }}%</p>
  </div>

  <div class="summary__section" *ngIf="highExposureTasks.length > 0">
    <h2 class="summary__section-title">Highest exposure tasks</h2>
    <ul class="summary__list">
      <li *ngFor="let task of highExposureTasks">{{ task.description }}</li>
    </ul>
  </div>

  <div class="summary__section" *ngIf="lowExposureTasks.length > 0">
    <h2 class="summary__section-title">Lowest exposure tasks</h2>
    <ul class="summary__list">
      <li *ngFor="let task of lowExposureTasks">{{ task.description }}</li>
    </ul>
  </div>

  <div class="summary__section" *ngIf="topAction">
    <h2 class="summary__section-title">Top recommended action</h2>
    <p class="summary__action">{{ topAction.description }}</p>
  </div>

  <div class="summary__options">
    <button type="button" class="summary__download" (click)="downloadReport()">
      Download full report
    </button>
  </div>
</div>
