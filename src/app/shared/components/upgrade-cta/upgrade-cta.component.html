<!-- Inline variant - compact CTA -->
<div class="upgrade-cta upgrade-cta--inline" *ngIf="variant === 'inline'">
  <div class="upgrade-cta__badge">PREMIUM</div>

  <h3 class="upgrade-cta__title">Unlock your full report</h3>
  <p class="upgrade-cta__description">
    Get detailed breakdown, personalized roadmap, and unlimited assessments
  </p>

  <div class="upgrade-cta__price-row">
    <span class="upgrade-cta__price">{{ price }}</span>
    <span class="upgrade-cta__price-note">one-time</span>
  </div>

  <div class="upgrade-cta__actions">
    <button type="button" class="upgrade-cta__button upgrade-cta__button--primary" (click)="onUpgrade()">
      Unlock Full Report
    </button>
    <button type="button" class="upgrade-cta__button upgrade-cta__button--secondary" (click)="onContinueFree()">
      Continue with free version
    </button>
  </div>
</div>

<!-- Full variant - comparison table -->
<div class="upgrade-cta upgrade-cta--full" *ngIf="variant === 'full'">
  <div class="upgrade-cta__header">
    <h2 class="upgrade-cta__headline">Choose your plan</h2>
    <p class="upgrade-cta__subheadline">Unlock detailed insights to future-proof your career</p>
  </div>

  <div class="upgrade-cta__plans">
    <!-- Free plan -->
    <div class="upgrade-cta__plan">
      <div class="upgrade-cta__plan-header">
        <h3 class="upgrade-cta__plan-name">Free</h3>
        <div class="upgrade-cta__plan-price">
          <span class="upgrade-cta__plan-amount">€0</span>
        </div>
      </div>
      <ul class="upgrade-cta__plan-features">
        <li *ngFor="let feature of freeFeatures" class="upgrade-cta__plan-feature">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          {{ feature }}
        </li>
      </ul>
      <button
        type="button"
        class="upgrade-cta__plan-button upgrade-cta__plan-button--secondary"
        (click)="onContinueFree()">
        Continue Free
      </button>
    </div>

    <!-- Premium plan -->
    <div class="upgrade-cta__plan upgrade-cta__plan--featured">
      <div class="upgrade-cta__plan-badge">RECOMMENDED</div>
      <div class="upgrade-cta__plan-header">
        <h3 class="upgrade-cta__plan-name">Premium</h3>
        <div class="upgrade-cta__plan-price">
          <span class="upgrade-cta__plan-amount">{{ price }}</span>
          <span class="upgrade-cta__plan-period">one-time</span>
        </div>
      </div>
      <ul class="upgrade-cta__plan-features">
        <li *ngFor="let feature of premiumFeatures" class="upgrade-cta__plan-feature upgrade-cta__plan-feature--premium">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          {{ feature }}
        </li>
      </ul>
      <button
        type="button"
        class="upgrade-cta__plan-button upgrade-cta__plan-button--primary"
        (click)="onUpgrade()">
        Get Premium
      </button>
    </div>
  </div>
</div>
